<!DOCTYPE html>
<html lang="en">
<!DOCTYPE html>
<html>
<head>
  <title>Transition</title>
<style>
.box {
  width: 150px;
  height: 150px;
 background-image: url(/wed.html/images/dargon.jpg);

  /* Transition property */
  transition: all 0.5s ease;
}

.box:hover {
  background-image: url(wed.html/images/chinese.jpg);
  transform: scale(1.2);
}
</style>
</head>
<body>

<div class="box"></div>

</body>
</html>
