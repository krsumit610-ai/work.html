<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
</head>
<body>
    <h1>Form</h1>
    <form action="">
        <label for="">Name</label>
        <input type="text">
        <br><br>
        <label for="">Email ID</label>
        <input type="Email">
        <br><br>
        <label for="">Password</label>
        <input type="password">
        <br><br>
        <label>Gender</label>
        <input type="radio" name="gen">male</input>
        <input type="radio" name="gen">female</input>
        <br><br>
        <label for="">Sports</label>
        <input type="checkbox">Football</input>
        <input type="checkbox">Cricket</input>
        <input type="checkbox">Table Tennis</input>
        <input type="checkbox">Badminton</input>
        <br><br>
        <label for="">Age</label>
        <select name="" id="">
            <option value="">Below 18 Child</option>
            <option value="">Above 18 Adult</option>
        </select>
        <br><br>
        <button>Login</button>
    </form>
</body>
</html>
