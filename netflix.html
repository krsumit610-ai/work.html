<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css">

    <title>NETFLIX</title>

    <style>

        *{
            margin: 0px;
            padding: 0px;
        }

        .main{
            height: 97vh;
            width: 100vw;
            /* background-image: url("./netflixBG.png"); */
            background : linear-gradient(to left, rgba(0,0,0,0.2), rgba(0,0,0,0.7)), url('https://cdn.mos.cms.futurecdn.net/rDJegQJaCyGaYysj2g5XWY.jpg');
            background-size: cover;
        }

        .nav{
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .navRight{
            display: flex;
        }

        .dd{
            height: 50px;
            width: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            padding-left: 8px;
            padding-right: 8px;
            border-radius: 8px;
        }

        select{
            border: none;
            color: white;
            background : transparent
        }

        .signIn{
            color: white;
            background-color: red;
            border-radius: 8px;
            margin-left: 50px;
            width: 100px;
            font-size: 20px;
            font-weight: bolder;
            border: none;
            margin-right: 10px;
            cursor: pointer;
        }


        .container{
            /* height: 100vh;
            width: 100vw; */
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            flex-direction: column;
        }
        .heading{
            font-size: 50px;
            font-family: arial;
            font-weight: 30px;
        }
        .para1{
            margin: 20px;
            font-size: 28px;
        }
        .emailandenter{
             /* height: 97vh; */
            width: 99vw;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 35px;
        }
       
        .enter{
            height: 7vh;
            width: 60vb;
            background-color: transparent;
            text-align: center;
            color: white;
            font-size: 25px;
            font-family: 'Times New Roman', Times, serif;
            border-radius: 12px;
            border: 2px solid black;
            font-weight: 50px;
        }
        .button{
             height: 8vh;
            width: 40vb;
            margin-left: 15px;
            font-size: 25px;
            font-family: 'Times New Roman', Times, serif;
            border-radius: 12px;
            background-color: red;
            color: white;
            border: 2px solid black;
            cursor: pointer;
            transition: .3s;}
            .button:hover{
            transform:translateY(-5px);

            }
    </style>
    
</head>
<body>
    
    <div class="main">

        <div class="nav">

            <img src="./netlogo.png" alt="" height="140px" width="220px">
            <div class="navRight">
                <div class="dd">
                    <img src="./language.png" alt="" height="30px" width="40px">
                    <select style="padding-left: 5px;">
                    <option value="English" style="color: black;">English</option>
                    <option value="Hindi" style="color: black;">Hindi</option>
                    </select>
                </div>
            <button class="signIn">Sign in</button>
            </div>
        </div>

        <div class="container">
            <h1 class="heading">Unlimited Movies, <br>Shows, And More</h1>
            <p class="para1">Starts at ₹149. Cancel at any time.</p>
            <p class="para2">Ready to watch? Enter your email to create or restart your membership.</p>
             
            <div class="emailandenter">

            <div id="left"> 
                <input type="text" placeholder="Email Address" class="enter">
            </div>
            <div id="right"> <button class="button">Get Start ➜</button></div>

        </div>
        </div>
       

    </div>

</body>
</html>
